name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test StenmarkCore
        run: swift test --package-path Packages/StenmarkCore
      - name: Test StenmarkWeb
        run: swift test --package-path Packages/StenmarkWeb
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Stenmark.xcodeproj -scheme Stenmark -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
